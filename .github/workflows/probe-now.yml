name: 探测 Now Player v12（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: lang=zh 中文标题验证
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          B="https://nowplayer.now.com"
          {
            echo "===== A. 中文页面 lang 变量 ====="
            curl -sS --compressed -o /tmp/zh.html --max-time 30 -A "$UA" "$B/tvguide?lang=zh"
            echo "  大小 $(wc -c < /tmp/zh.html)"
            grep -oE "var lang = '[a-z]+'" /tmp/zh.html | head -3
            grep -oE '<html lang="[^"]*"' /tmp/zh.html | head -2
            grep -oE 'hreflang="[^"]*"' /tmp/zh.html | head -4

            echo
            echo "===== B. lang=zh 下的 epglist（带 cookie/referer）====="
            for q in "channelIdList=366&day=2" "channelIdList=332&day=2" "channelIdList=548&day=2"; do
              curl -sS --compressed -o /tmp/z.json --max-time 25 -A "$UA" -H "Referer: $B/tvguide?lang=zh" "$B/tvguide/epglist?$q"
              node -e "
                try{const j=JSON.parse(require('fs').readFileSync('/tmp/z.json','utf8'));
                const ps=j[0]||[];
                console.log('  [$q] '+ps.length+' 条');
                ps.slice(0,4).forEach(p=>console.log('     '+p.name));
                }catch(e){console.log('  [$q] 失败')}
              "
            done

            echo
            echo "===== C. 带 lang 参数请求 epglist ====="
            for extra in "&lang=zh" "&lang=zh-hk" "&lang=chi"; do
              curl -sS --compressed -o /tmp/z2.json --max-time 25 -A "$UA" -H "Referer: $B/tvguide?lang=zh" "$B/tvguide/epglist?channelIdList=366&day=2$extra"
              node -e "
                try{const j=JSON.parse(require('fs').readFileSync('/tmp/z2.json','utf8'));
                const ps=j[0]||[];
                console.log('  [$extra] '+ps.length+' 条: '+ps.slice(0,3).map(p=>p.name).join(' / '));
                }catch(e){console.log('  [$extra] 失败')}
              "
            done

            echo
            echo "===== D. 带 Cookie 语言偏好 ====="
            curl -sS --compressed -o /tmp/z3.json --max-time 25 -A "$UA" \
              -H "Referer: $B/tvguide?lang=zh" -H "Cookie: lang=zh; lang_pref=zh; NOWTV_LANG=zh" \
              "$B/tvguide/epglist?channelIdList=366&day=2"
            node -e "
              try{const j=JSON.parse(require('fs').readFileSync('/tmp/z3.json','utf8'));
              const ps=j[0]||[];
              console.log('  cookie=zh '+ps.length+' 条: '+ps.slice(0,3).map(p=>p.name).join(' / '));
              }catch(e){console.log('  失败')}
            "

            echo
            echo "===== E. 中文页面里的频道名（对比英文）====="
            grep -oE 'class="ch-num">[0-9]+</span>' /tmp/zh.html | head -3
            grep -oE 'alt="[^"]{2,30}"' /tmp/zh.html | sort -u | head -15
            echo "  --- 中文页面 channeldetail/366 ---"
            curl -sS --compressed -o /tmp/zc.html --max-time 25 -A "$UA" "$B/tvguide/channeldetail/366/1?lang=zh"
            grep -oE '<title>[^<]*</title>' /tmp/zc.html

            echo
            echo "===== F. 中文节目详情（epgprogramdetail）====="
            curl -sS --compressed -o /tmp/zz.json --max-time 25 -A "$UA" "$B/tvguide/epglist?channelIdList=366&day=2"
            PID=$(node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/zz.json','utf8'));console.log(j[0][3].vimProgramId)")
            echo "  pid=$PID"
            curl -sS --compressed --max-time 25 -A "$UA" -H "Referer: $B/tvguide?lang=zh" "$B/tvguide/epgprogramdetail?programId=$PID&lang=zh" | head -c 1500
            echo
            echo "  --- 详情里的中文字段 ---"
            curl -sS --compressed -o /tmp/zz2.json --max-time 25 -A "$UA" "$B/tvguide/epgprogramdetail?programId=$PID"
            node -e "
              const d=JSON.parse(require('fs').readFileSync('/tmp/zz2.json','utf8'));
              console.log('  chiProgName: '+d.chiProgName);
              console.log('  chiSeriesName: '+d.chiSeriesName);
              console.log('  engProgName: '+d.engProgName);
              console.log('  chiSynopsis: '+(d.chiSynopsis||'').slice(0,60));
              console.log('  engSynopsis: '+(d.engSynopsis||'').slice(0,60));
              console.log('  synopsis: '+(d.synopsis||'').slice(0,60));
            " 2>&1
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: np-probe12, path: out/ }
