name: 对比 webncode vs nowplayer（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 对比
        run: node tools/compare-now.mjs 2>&1 | tee report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: np-cmp, path: "*.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: np-cmp-txt, path: report.txt }
