name: 探测 Now Player v11（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 按标题去重的真实简介覆盖率
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          B="https://nowplayer.now.com"
          {
            for id in 366 548 332 333 331; do
              echo "===== 台 $id ====="
              for day in 1 2 3 4 5 6 7; do
                curl -sS --compressed -o out/raw_${id}_$day.json --max-time 25 -A "$UA" "$B/tvguide/epglist?channelIdList=$id&day=$day"
              done
              node -e "
                const fs=require('fs');
                const rows=[];
                for(let d=1;d<=7;d++){const j=JSON.parse(fs.readFileSync('out/raw_${id}_'+d+'.json','utf8'));for(const p of (j[0]||[]))rows.push(p)}
                const seen=new Set(); const uniq=[];
                for(const r of rows){const k=r.start+'|'+r.name; if(seen.has(k))continue; seen.add(k); uniq.push(r)}
                const byName={};
                for(const r of uniq){ (byName[r.name]=byName[r.name]||[]).push(r.vimProgramId) }
                const names=Object.keys(byName);
                console.log('  原始行 '+rows.length+' | 去重后 '+uniq.length+' | 唯一标题 '+names.length);
                // 每个标题取第一个 pid
                fs.writeFileSync('/tmp/t${id}.txt', names.map(n=>byName[n][0]+'\t'+n).join('\n'));
              "
              # 逐标题抓简介
              HIT=0; TOT=0
              while IFS=$'\t' read -r PID NAME; do
                [ -z "$PID" ] && continue
                TOT=$((TOT+1))
                R=$(curl -sS --compressed --max-time 20 -A "$UA" "$B/tvguide/epgprogramdetail?programId=$PID" 2>/dev/null)
                L=$(node -e "
                  let s=process.argv[1]; try{const d=JSON.parse(s);
                  const sy=(d.chiSynopsis||'').trim()||(d.synopsis||'').trim();
                  console.log(sy?sy.length:0)}catch(e){console.log(-1)}" "$R" 2>&1)
                if [ "$L" -gt 20 ] 2>/dev/null; then HIT=$((HIT+1)); fi
              done < /tmp/t${id}.txt
              echo "  唯一标题简介命中 $HIT/$TOT = $((HIT*100/TOT))%"

              # 按命中比例折算「整台节目的简介覆盖率」
              node -e "
                const fs=require('fs');
                const rows=[];
                for(let d=1;d<=7;d++){const j=JSON.parse(fs.readFileSync('out/raw_${id}_'+d+'.json','utf8'));for(const p of (j[0]||[]))rows.push(p)}
                const seen=new Set(); const uniq=[];
                for(const r of rows){const k=r.start+'|'+r.name; if(seen.has(k))continue; seen.add(k); uniq.push(r)}
                const byDay={};
                for(const r of uniq){const dd=new Date(r.start+8*3600e3).toISOString().slice(0,10); byDay[dd]=(byDay[dd]||0)+1}
                const ks=Object.keys(byDay).sort();
                console.log('  按北京日: '+ks.map(k=>k.slice(5)+':'+byDay[k]).join(' '));
                fs.writeFileSync('/tmp/uniq${id}.json',JSON.stringify(uniq));
              "
              echo
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: np-probe11, path: out/ }
