name: 探测 MOD 周末缺失 + 频道完整性（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: MOD 细节
        run: |
          set +e
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          M="https://modp.cht.com.tw/modinfo/epginfob.php"
          {
            echo "########## A. 周末缺失：直接看 w=0 原始日期块 ##########"
            curl -sS --compressed -o out/a.html --max-time 25 -A "$UA" "$M?id=6&w=0"
            node -e "
              const fs=require('fs');
              const h=fs.readFileSync('out/a.html','utf8');
              // 每个 epgdays 块
              const blocks=h.split(\"<div class='epgdays'>\").slice(1);
              console.log('  epgdays 块数: '+blocks.length);
              for(const b of blocks){
                const d=(b.match(/background-color:#ccc;padding:5px;'>([^<]+)</)||[])[1]||'?';
                const n=[...b.matchAll(/<div class='(?:past|now|future)'/g)].length;
                console.log('    '+d+' -> '+n+' 条');
              }
            " 2>&1
            echo
            echo "  --- 页面里有没有 10-31 / 11-01 字样 ---"
            grep -c "2026-10-31" out/a.html
            grep -c "2026-11-01" out/a.html
            echo "  --- datemenu 原文 ---"
            grep -oE \"<div class='datemenu'>[^<]*(<a[^>]*>[^<]*</a>[^<]*)+</div>\" out/a.html | head -2
            grep -oE \"datemenu.{0,400}\" out/a.html | head -1

            echo
            echo "########## B. 换不同频道看周末是否也缺（id=8 台视 / id=200 ELTA）##########"
            for id in 8 200 15; do
              curl -sS --compressed -o /tmp/b$id.html --max-time 25 -A "$UA" "$M?id=$id&w=0"
              node -e "
                const fs=require('fs');
                const h=fs.readFileSync('/tmp/b$id.html','utf8');
                const days=[...h.matchAll(/background-color:#ccc;padding:5px;'>(\d{4}-\d{2}-\d{2})/g)].map(m=>m[1]);
                console.log('  id=$id -> '+days.join(', '));
              " 2>&1
            done

            echo
            echo "########## C. w=1 的日期是否接续 w=0 ##########"
            curl -sS --compressed -o out/c.html --max-time 25 -A "$UA" "$M?id=8&w=1"
            node -e "
              const fs=require('fs');
              const h=fs.readFileSync('out/c.html','utf8');
              const days=[...h.matchAll(/background-color:#ccc;padding:5px;'>(\d{4}-\d{2}-\d{2})/g)].map(m=>m[1]);
              console.log('  id=8 w=1 -> '+days.join(', '));
            " 2>&1

            echo
            echo "########## D. 频道清单完整性（187 台 vs 页面数字）##########"
            curl -sS --compressed -o out/all.html --max-time 30 -A "$UA" "https://mod.cht.com.tw/%E9%A0%BB%E9%81%93TV/%E5%85%A8%E9%83%A8.do"
            node -e "
              const fs=require('fs');
              const h=fs.readFileSync('out/all.html','utf8');
              const nums=[...h.matchAll(/<div class=\"number\">(\d+)<\/div>/g)].map(m=>m[1]);
              console.log('  number 元素 '+nums.length+' 个，唯一 '+new Set(nums).size);
              const names=[...h.matchAll(/<h3><a[^>]*>([^<]+)<\/a><\/h3>/g)].map(m=>m[1].trim());
              console.log('  h3 名字 '+names.length+' 个');
              // 配对检查
              const re=/<div class=\"number\">(\d+)<\/div>[\s\S]{0,900}?<h3><a[^>]*>([^<]+)<\/a><\/h3>/g;
              const out=[]; let m;
              while((m=re.exec(h))) out.push({id:m[1], name:m[2].trim()});
              console.log('  配对成功 '+out.length);
              fs.writeFileSync('out/ch.json', JSON.stringify(out,null,1));
              console.log('  --- 按号段统计 ---');
              const seg={};
              for(const c of out){ const k=Math.floor(Number(c.id)/50)*50; seg[k]=(seg[k]||0)+1 }
              console.log('  '+JSON.stringify(seg));
            " 2>&1

            echo
            echo "########## E. 抽样验证频道清单是否都能抓到节目（抽 15 个）##########"
            node -e "
              const fs=require('fs');
              const ch=JSON.parse(fs.readFileSync('out/ch.json','utf8'));
              const pick=[];
              for(let i=0;i<15;i++) pick.push(ch[Math.floor(i*ch.length/15)]);
              fs.writeFileSync('/tmp/pick.txt', pick.map(c=>c.id+'\t'+c.name).join('\n'));
            "
            while IFS=$'\t' read -r id name; do
              curl -sS --compressed -o /tmp/e.html --max-time 20 -A "$UA" "$M?id=$id&w=0"
              N=$(node -e "
                const fs=require('fs');
                const h=fs.readFileSync('/tmp/e.html','utf8');
                const progs=[...h.matchAll(/<div class='(?:past|now|future)'/g)].length;
                const days=[...h.matchAll(/background-color:#ccc;padding:5px;'>(\d{4}-\d{2}-\d{2})/g)].length;
                console.log(days+'天/'+progs+'条');
              " 2>&1)
              echo "  $id | $name | $N"
            done < /tmp/pick.txt

            echo
            echo "########## F. 并发限速复核（串行 1 路 vs 3 路 vs 5 路）##########"
            for P in 1 3 5; do
              START=$(date +%s)
              RES=$(seq 6 15 | xargs -P $P -I{} curl -sS --compressed -o /dev/null -w "%{http_code}\n" --max-time 25 -A "$UA" "$M?id={}&w=0" 2>/dev/null | sort | uniq -c | tr '\n' ' ')
              END=$(date +%s)
              echo "  P=$P -> $RES | $((END-START))s"
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: modx, path: out/ }
