name: 探测 Now Player v9（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 同标题简介一致性 + 按北京日覆盖
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          B="https://nowplayer.now.com"
          {
            echo "===== A. 同标题不同 pid 的简介是否一致 ====="
            for id in 366 548 332 333; do
              for day in 1 2 3 4 5 6 7; do
                curl -sS --compressed -o /tmp/x${id}_$day.json --max-time 25 -A "$UA" "$B/tvguide/epglist?channelIdList=$id&day=$day"
              done
              node -e "
                const fs=require('fs');
                const rows=[];
                for(let d=1;d<=7;d++){const j=JSON.parse(fs.readFileSync('/tmp/x${id}_'+d+'.json','utf8'));for(const p of (j[0]||[]))rows.push(p)}
                const byName={};
                for(const r of rows){ (byName[r.name]=byName[r.name]||[]).push(r.vimProgramId) }
                const groups=Object.entries(byName).filter(([k,v])=>v.length>=3).slice(0,5);
                fs.writeFileSync('/tmp/g${id}.txt', groups.map(([k,v])=>v[0]+','+v[1]+','+v[Math.floor(v.length/2)]+'\t'+k).join('\n'));
                console.log('  ${id}: 唯一标题'+Object.keys(byName).length+' / 行'+rows.length+' / 可测组'+Object.entries(byName).filter(([k,v])=>v.length>=3).length);
              "
              while IFS=$'\t' read -r PIDS NAME; do
                [ -z "$PIDS" ] && continue
                echo "  --- [$NAME]"
                H=""
                for pid in $(echo "$PIDS" | tr ',' ' '); do
                  R=$(curl -sS --compressed --max-time 20 -A "$UA" "$B/tvguide/epgprogramdetail?programId=$pid" 2>/dev/null)
                  H="$H $(node -e "
                    let s=process.argv[1]; try{const d=JSON.parse(s);
                    const sy=((d.chiSynopsis||'').trim()||(d.synopsis||'').trim());
                    console.log(require('crypto').createHash('md5').update(sy).digest('hex').slice(0,6)+':'+sy.length)}catch(e){console.log('ERR')}" "$R" 2>&1)"
                done
                echo "     hash:$H"
              done < /tmp/g${id}.txt
            done

            echo
            echo "===== B. day1~7 按北京日合并后的每日条数 ====="
            for id in 366 548 332 333 331; do
              for day in 1 2 3 4 5 6 7; do
                curl -sS --compressed -o /tmp/y${id}_$day.json --max-time 25 -A "$UA" "$B/tvguide/epglist?channelIdList=$id&day=$day"
              done
              node -e "
                const fs=require('fs');
                const rows=[];
                for(let d=1;d<=7;d++){const j=JSON.parse(fs.readFileSync('/tmp/y${id}_'+d+'.json','utf8'));for(const p of (j[0]||[]))rows.push(p)}
                // 源内按 start|name 去重
                const seen=new Set(); const uniq=[];
                for(const r of rows){const k=r.start+'|'+r.name; if(seen.has(k))continue; seen.add(k); uniq.push(r)}
                uniq.sort((a,b)=>a.start-b.start);
                const byDay={};
                let hours={};
                for(const r of uniq){
                  const dd=new Date(r.start+8*3600e3).toISOString().slice(0,10);
                  byDay[dd]=(byDay[dd]||0)+1;
                  hours[dd]=(hours[dd]||0)+(r.end-r.start)/3600e3;
                }
                console.log('  ${id}: 原始'+rows.length+' 去重后'+uniq.length);
                for(const k of Object.keys(byDay).sort()) console.log('    '+k+' -> '+byDay[k]+' 条 / '+hours[k].toFixed(1)+' 小时');
              "
            done

            echo
            echo "===== C. 简介按标题去重的总成本估算 ====="
            for id in 366 548 332 333 331; do
              node -e "
                const fs=require('fs');
                const rows=[];
                for(let d=1;d<=7;d++){const j=JSON.parse(fs.readFileSync('/tmp/y${id}_'+d+'.json','utf8'));for(const p of (j[0]||[]))rows.push(p)}
                const seen=new Set(); const uniq=[];
                for(const r of rows){const k=r.start+'|'+r.name; if(seen.has(k))continue; seen.add(k); uniq.push(r)}
                const names=new Set(uniq.map(r=>r.name));
                console.log('  ${id}: 去重节目 '+uniq.length+' → 唯一标题 '+names.size+' （省 '+(100-Math.round(names.size/uniq.length*100))+'%）');
              "
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: np-probe9, path: out/ }
