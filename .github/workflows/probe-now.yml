name: 探测 MOD epginfob + TBC 备用路径（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: MOD epginfob
        run: |
          set +e
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          {
            echo "########## A. epginfob.php 原始页 ##########"
            curl -sS --compressed -o out/epg6.html -w "  id=6 -> %{http_code}|%{size_download}|%{time_total}s\n" --max-time 30 -A "$UA" -H "Referer: https://mod.cht.com.tw/program.do?id=6" "https://modp.cht.com.tw/modinfo/epginfob.php?id=6"
            echo "  大小: $(wc -c < out/epg6.html)"
            echo "  标题: $(grep -oE '<title>[^<]*</title>' out/epg6.html | head -1)"
            echo
            echo "  --- 全文前 4000 字节 ---"
            head -c 4000 out/epg6.html
            echo
            echo
            echo "  --- 关键 class ---"
            grep -oE 'class="[^"]{2,50}"' out/epg6.html | sort | uniq -c | sort -rn | head -20
            echo
            echo "  --- 日期/参数痕迹 ---"
            grep -oE '(date|day|Date|Day|sel)[^,;<>]{0,70}' out/epg6.html | head -20
            echo
            echo "  --- 是否有 JSON ---"
            grep -cE '\{"' out/epg6.html
            echo
            echo "  --- 所有链接/接口 ---"
            grep -oE "(href|src|url|action)\s*[:=]\s*['\"][^'\"]{3,90}['\"]" out/epg6.html | sort -u | head -30

            echo
            echo "########## B. epginfob 带日期参数试探 ##########"
            for p in "" "&date=2026-10-28" "&d=1" "&day=1" "&dt=20261028" "&selDate=2026-10-28" "&pdate=2026-10-28"; do
              R=$(curl -sS --compressed -o /tmp/e.html -w "%{http_code}|%{size_download}" --max-time 20 -A "$UA" "https://modp.cht.com.tw/modinfo/epginfob.php?id=6$p" 2>/dev/null || echo ERR)
              H=$(md5sum /tmp/e.html 2>/dev/null | cut -c1-8)
              echo "  [$p] -> $R | md5=$H"
            done

            echo
            echo "########## C. 同目录其他 php 试探 ##########"
            for f in epginfo.php epg.php epginfob.php epginfoa.php epglist.php; do
              R=$(curl -sS --compressed -o /tmp/f.html -w "%{http_code}|%{size_download}" --max-time 15 -A "$UA" "https://modp.cht.com.tw/modinfo/$f?id=6" 2>/dev/null || echo ERR)
              echo "  $f -> $R"
            done

            echo
            echo "########## D. 多频道 id 抽样 ##########"
            for id in 6 7 8 10 20 50 100; do
              R=$(curl -sS --compressed -o /tmp/g$id.html -w "%{http_code}|%{size_download}" --max-time 20 -A "$UA" "https://modp.cht.com.tw/modinfo/epginfob.php?id=$id" 2>/dev/null || echo ERR)
              T=$(grep -oE '<title>[^<]*</title>' /tmp/g$id.html 2>/dev/null | head -1)
              echo "  id=$id -> $R | $T"
            done

            echo
            echo "########## E. TBC 备用路径（不同域名/端口/协议）##########"
            for u in "http://123.241.238.168/" "https://123.241.238.168/" "http://www.tbc.net.tw/Epg/Epg/indexV2" "https://tbc.net.tw/Epg/Epg/indexV2" "https://www.tbc.net.tw:8080/"; do
              R=$(curl -sSk -o /tmp/t.html -w "%{http_code}|%{size_download}|%{time_total}s" --max-time 12 -A "$UA" -H "Host: www.tbc.net.tw" "$u" 2>/dev/null || echo TIMEOUT)
              echo "  $u -> $R"
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: modepg, path: out/ }
