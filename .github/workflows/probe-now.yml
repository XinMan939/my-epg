name: 探测 Now Player（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 深挖 tv-guide.js 与 catalogapi
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          {
            echo "===== tv-guide.js ====="
            curl -sS --compressed -o out/tv-guide.js -w "HTTP:%{http_code} 大小:%{size_download}\n" \
              --max-time 30 -A "$UA" "https://nowplayer.now.com/js/tv-guide.js"
            echo "--- 里面的 URL / api ---"
            grep -oE '(https?:)?//[a-zA-Z0-9._/-]+' out/tv-guide.js 2>/dev/null | sort -u | head -40
            echo
            echo "--- ajax / fetch 调用 ---"
            grep -nE '\.ajax|\.get\(|\.post\(|fetch\(|url:' out/tv-guide.js 2>/dev/null | head -40
            echo
            echo "--- 全文前 3000 字节 ---"
            head -c 3000 out/tv-guide.js 2>/dev/null; echo
            echo
            echo "===== catalogapi.nowtv.now.com 试探 ====="
            getent hosts catalogapi.nowtv.now.com || echo "DNS 失败"
            for p in \
              "" \
              "api/v1/channels" \
              "api/v2/channels" \
              "channels" \
              "epg" \
              "api/epg" \
              "api/v1/epg" \
              ; do
              R=$(curl -sS --compressed -o /tmp/c.json -w "%{http_code}|%{size_download}" --max-time 15 -A "$UA" \
                "https://catalogapi.nowtv.now.com/$p" 2>&1 || echo "ERR")
              echo "  /$p → $R"
              head -c 250 /tmp/c.json 2>/dev/null | tr -d '\n'; echo
            done
            echo
            echo "===== script-min.js 里搜 api ====="
            curl -sS --compressed -o out/script.js --max-time 30 -A "$UA" "https://nowplayer.now.com/js/script-min.js"
            echo "大小: $(wc -c < out/script.js)"
            grep -oE '(https?:)?//[a-zA-Z0-9._/-]*api[a-zA-Z0-9._/-]*' out/script.js 2>/dev/null | sort -u | head -20
            grep -nE 'tvguide|TvGuide|getEpg|GetEpg|epg' out/script.js 2>/dev/null | head -20
            echo
            echo "===== 页面 HTML 里的 tvguide 相关 ====="
            curl -sS --compressed -o out/page.html --max-time 30 -A "$UA" "https://nowplayer.now.com/tvguide"
            grep -nE 'tvguide|epg|programme|catalogapi' out/page.html 2>/dev/null | head -25
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: np-probe, path: out/ }
