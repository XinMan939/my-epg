name: 探测 Now Player v5（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 频道名对照 + 简介覆盖
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          B="https://nowplayer.now.com"
          curl -sS --compressed -o out/page.html --max-time 30 -A "$UA" "$B/tvguide"
          IDS=$(grep -oE '/tvguide/channeldetail/[0-9]+/' out/page.html | grep -oE '[0-9]+' | sort -u)
          echo "频道数: $(echo "$IDS" | wc -l)" > out/names.txt
          echo "===== id | 频道名 =====" >> out/names.txt
          for id in $IDS; do
            N=$(curl -sS --compressed --max-time 20 -A "$UA" "$B/tvguide/channeldetail/$id/1" 2>/dev/null \
              | grep -oE '<title>[^<]*</title>' | head -1 | sed -E 's#</?title>##g; s#Now TV Website - Coming Up > ##')
            echo "$id | $N" >> out/names.txt
            echo "$id | $N"
          done

          echo
          echo "===== 抽样测 epgprogramdetail 简介覆盖 =====" > out/syn.txt
          for id in 327 326 324 112 102 208 096; do
            curl -sS --compressed -o /tmp/p$id.json --max-time 25 -A "$UA" -H "Referer: $B/tvguide" "$B/tvguide/epglist?channelIdList=$id&day=2"
            node -e "
              const j=JSON.parse(require('fs').readFileSync('/tmp/p$id.json','utf8'));
              const ps=j[0]||[];
              const sids=[...new Set(ps.map(p=>p.sid||p.cid||p.name))];
              console.log('$id | 节目'+ps.length+' | 唯一sid '+sids.length);
              require('fs').writeFileSync('/tmp/sids$id.txt', sids.slice(0,25).join('\n'));
              require('fs').writeFileSync('/tmp/pids$id.txt', ps.slice(0,25).map(p=>p.vimProgramId).join('\n'));
            " >> out/syn.txt 2>&1
            # 抓 12 个节目的详情看 synopsis 命中率
            HIT=0; TOT=0; SAMPLE=""
            for pid in $(head -12 /tmp/pids$id.txt); do
              TOT=$((TOT+1))
              R=$(curl -sS --compressed --max-time 20 -A "$UA" -H "Referer: $B/tvguide" "$B/tvguide/epgprogramdetail?programId=$pid" 2>/dev/null)
              L=$(node -e "
                let s=process.argv[1]; try{const d=JSON.parse(s);
                const sy=(d.chiSynopsis||'').trim()||(d.synopsis||'').trim()||(d.engSynopsis||'').trim();
                console.log(sy?sy.length:0)}catch(e){console.log(-1)}" "$R" 2>&1)
              if [ "$L" -gt 20 ] 2>/dev/null; then HIT=$((HIT+1)); SAMPLE="$L"; fi
            done
            echo "  $id 简介命中 $HIT/$TOT (样例长度 ${SAMPLE:-0})" >> out/syn.txt
            echo "  $id 简介命中 $HIT/$TOT"
          done

          echo
          echo "===== 全部台 7 天条数矩阵（批量 8 台一组）=====" > out/matrix.txt
          echo "$IDS" > /tmp/ids.txt
          IDARR=$(cat /tmp/ids.txt | tr '\n' ' ')
          Q=""; N=0; GRP=1
          for id in $IDARR; do
            Q="$Q&channelIdList%5B%5D=$id"; N=$((N+1))
            if [ $N -eq 8 ]; then
              curl -sS --compressed -o /tmp/g.json --max-time 30 -A "$UA" -H "Referer: $B/tvguide" "$B/tvguide/epglist?day=2$Q"
              node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/g.json','utf8'));console.log('组'+$GRP+': '+j.map(x=>x.length).join('/'))}catch(e){console.log('组$GRP 失败')}" >> out/matrix.txt 2>&1
              Q=""; N=0; GRP=$((GRP+1))
            fi
          done
          if [ $N -gt 0 ]; then
            curl -sS --compressed -o /tmp/g.json --max-time 30 -A "$UA" -H "Referer: $B/tvguide" "$B/tvguide/epglist?day=2$Q"
            node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/g.json','utf8'));console.log('组$GRP(尾): '+j.map(x=>x.length).join('/'))}catch(e){console.log('组$GRP 失败')}" >> out/matrix.txt 2>&1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: np-probe5, path: out/ }
