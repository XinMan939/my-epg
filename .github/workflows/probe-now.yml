name: 验证 nowplayer 模块（临时）
on:/n  workflow_dispatch:/njobs:/n  probe:/n    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:/n      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 跑模块真实逻辑
        run: |
          cp .probe/verify.mjs ./verify.mjs 2>/dev/null || true
          node verify.mjs > report.txt 2>&1 || true
          cat report.txt
      - uses: actions/upload-artifact@v4
        with: { name: np-mod, path: "*.txt" }
      - uses: actions/upload-artifact@v4
        with: { name: np-cat, path: np-catalog.json }
