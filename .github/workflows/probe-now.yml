name: MOD 探测（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 跑探测
        run: node tools/probe-mod.mjs 2>&1 | tee report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: modx, path: "*.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: modx-txt, path: report.txt }
