name: 探测 ELTA OTT API（临时）
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'true = 跑 catalog 重扫 + build'
        required: false
        default: 'false'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 缓存数据源
        uses: actions/cache@v4
        with:
          path: .cache
          key: epg-cache-${{ github.run_id }}
          restore-keys: |
            epg-cache-
      - name: 实测 elta.mjs
        run: |
          mkdir -p out
          {
            echo "===== listChannels ====="
            node -e "
              import('./src/sources/elta.mjs').then(async m => {
                const l = await m.listChannels();
                console.log(JSON.stringify(l, null, 1));
                const t = l.reduce((s,c)=>s+c.count,0);
                const d = l.reduce((s,c)=>s+c.days,0);
                console.error('共 ' + l.length + ' 台 / ' + t + ' 条 / 天数合计 ' + d);
              })
            " 2>&1
            echo
            echo "===== getDayProgrammes 今天 101 ====="
            node -e "
              import('./src/sources/elta.mjs').then(async m => {
                const d = new Date(Date.now()+8*3600e3).toISOString().slice(0,10).replace(/-/g,'');
                const r = await m.getDayProgrammes('101', 1, d);
                console.log('条数:', r.programmes.length, '| err:', r.error || '无');
                const bj = t => new Date(t+8*3600e3).toISOString().slice(5,16).replace('T',' ');
                for (const p of r.programmes.slice(0,8)) {
                  console.log(' ', bj(p.startTs), '~', bj(p.stopTs), '|', p.title);
                }
                // 时长检查
                const bad = r.programmes.filter(p=>p.stopTs<=p.startTs).length;
                console.log('无效时长:', bad);
              })
            " 2>&1
          } > out/report.txt 2>&1
      - name: catalog + build
        if: github.event.inputs.full == 'true'
        run: |
          npm test 2>&1 | tail -25 >> out/report.txt
          echo "" >> out/report.txt
          echo "===== catalog 重扫 =====" >> out/report.txt
          node src/index.mjs catalog 2>&1 | tail -30 >> out/report.txt
          echo "" >> out/report.txt
          echo "===== build =====" >> out/report.txt
          DAYS=7 node src/index.mjs build 2>&1 | grep -E "\[elta\]|\[match\].*爱尔达|\[match\].*爱爾達|错误|失败|覆盖" >> out/report.txt
          echo "" >> out/report.txt
          echo "===== 爱尔达各台结果 =====" >> out/report.txt
          node -e "
            const r=require('./output/report.json');
            console.log('全站: 频道', r.channelsTotal, '有节目', r.channelsWithEpg, '空', r.channelsEmpty, '满7天', r.channelsFull);
            console.log('节目', r.programmesTotal, '简介', r.programmesWithDesc, r.descCoverage+'%');
            const rows=(r.detail||[]).filter(x=>String(x.name||'').includes('爱尔达')||String(x.name||'').includes('爱爾達'));
            for(const x of rows) console.log(' ', String(x.id).padEnd(22), '条', String(x.count).padStart(4), '天', x.days, '简', String(x.withDesc).padStart(3), x.status, '|', x.usedSource);
          " >> out/report.txt 2>&1
          cp channels/catalog.json out/catalog-new.json 2>/dev/null || true
          cp output/report.json out/report-full.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: elta-probe, path: out/ }
