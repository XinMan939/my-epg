name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 验证正确签名
        run: |
          mkdir -p out
          B="https://appapi.tdm.com.mo"
          {
            echo "=== 1) program-list/Channel 带参数 ==="
            for q in "?lang=zh_TW" "?lang=zh" "?type=1" "?type=0" "?lang=zh_TW&type=1"; do
              echo "--- $q"
              curl -sS --max-time 15 "$B/api/v1.0/program-list/Channel$q" | head -c 500; echo
            done
            echo
            echo "=== 2) program-list/{date}?channelId=1 ==="
            curl -sSL --max-time 20 "$B/api/v1.0/program-list/2026-10-28?channelId=1" -o out/epg1.json
            wc -c out/epg1.json; head -c 1500 out/epg1.json; echo
            echo
            echo "=== 3) 各频道同一天 ==="
            for cid in 1 2 5 6 7 8 52 49 46; do
              sz=$(curl -sSL --max-time 20 "$B/api/v1.0/program-list/2026-10-28?channelId=$cid" -o out/epg_$cid.json -w "%{size_download}")
              echo "channelId=$cid -> ${sz}B"
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: tdm-probe, path: out/ }
