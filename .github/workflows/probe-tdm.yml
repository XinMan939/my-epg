name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 频道全量 + program-list 参数
        run: |
          mkdir -p out
          B="https://appapi.tdm.com.mo"
          curl -sSL --max-time 25 "$B/api/v1.0/live/categories" -o out/live.json
          curl -sSL --max-time 25 "$B/api/v1.0/program-list/categories" -o out/dates.json
          {
            echo "=== program-list/Channel 参数试探（POST） ==="
            for body in '{"channelId":1,"date":"2026-10-28"}' '{"channelId":1}' '{"id":1,"date":"2026-10-28"}' '{"channelCode":"91","date":"2026-10-28"}'; do
              echo "--- POST $body"
              curl -sS --max-time 15 -X POST -H "Content-Type: application/json" -d "$body" "$B/api/v1.0/program-list/Channel" | head -c 400; echo
            done
            echo
            echo "=== program-list/Channel GET 各种 query ==="
            for q in "?channelId=1&date=2026-10-28" "?id=1&date=2026-10-28" "?channel=1&date=2026-10-28" "?channelId=1&day=2026-10-28" "?channelId=1&dateStr=2026-10-28"; do
              echo "--- GET $q"
              curl -sS --max-time 15 "$B/api/v1.0/program-list/Channel$q" | head -c 300; echo
            done
            echo
            echo "=== program-list/ 路径带 id ==="
            for q in "program-list/1" "program-list/1/2026-10-28" "program-list/channel/1"; do
              echo "--- $q"
              curl -sS --max-time 15 "$B/api/v1.0/$q" | head -c 300; echo
            done
          } > out/report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with: { name: tdm-probe, path: out/ }
