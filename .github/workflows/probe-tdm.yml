name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 挖接口
        run: |
          mkdir -p out
          {
            echo "### get-domain"
            curl -sSL --max-time 20 "https://appapi.tdm.com.mo/api/v1/common/get-domain"; echo
            echo
            echo "### 所有 /api/v1 接口"
            curl -sSL --max-time 25 "https://appapi.tdm.com.mo/" -o /tmp/r.html
            for js in $(grep -oE '/static/js/[A-Za-z0-9._-]+\.js' /tmp/r.html | sort -u); do
              curl -sSL --max-time 30 "https://appapi.tdm.com.mo$js" -o /tmp/j.js 2>/dev/null || continue
              grep -ohE '/api/v[0-9]+/[a-zA-Z0-9_/{}$.:-]{2,70}' /tmp/j.js 2>/dev/null
              grep -ohE '"(get|fetch|post)?[A-Z][a-zA-Z]{2,30}(List|Info|Detail|Schedule|Program|Channel|Epg)"' /tmp/j.js 2>/dev/null
            done | sort -u
            echo
            echo "### 节目表页面"
            for u in "/zh/program/tv_zh" "/program/tv_zh" "/zh/program/tv"; do
              code=$(curl -sSL -o /tmp/p.html -w "%{http_code}|%{size_download}" --max-time 25 "https://appapi.tdm.com.mo$u" 2>&1 || echo ERR)
              echo "--- $u -> $code"
            done
          } > out/report.txt 2>&1
          wc -l out/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tdm-probe
          path: out/report.txt
