name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 挖 /static/js 里的接口定义
        run: |
          curl -sSL --max-time 25 "https://appapi.tdm.com.mo/" -o /tmp/r.html
          echo "===== 页面里的 js 引用 ====="
          grep -oE '/static/js/[A-Za-z0-9._-]+\.js' /tmp/r.html | sort -u | head -20
          echo
          echo "===== 逐个下载并挖接口 ====="
          for js in $(grep -oE '/static/js/[A-Za-z0-9._-]+\.js' /tmp/r.html | sort -u | head -20); do
            sz=$(curl -sSL --max-time 30 "https://appapi.tdm.com.mo$js" -o /tmp/j.js -w "%{size_download}" 2>/dev/null)
            echo "--- $js ($sz B)"
            [ "$sz" -lt 100 ] && continue
            grep -oE '"/[a-zA-Z0-9_/-]{3,60}"' /tmp/j.js | sort -u | grep -iE "api|channel|epg|program|schedule|live|list|get" | head -20
            grep -oE 'https?://[a-zA-Z0-9._-]+(tdm|api)[a-zA-Z0-9._/-]*' /tmp/j.js | sort -u | head -8
          done
