name: 探测 TDM API（临时）
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'true = 跑完整 catalog 重扫 + build'
        required: false
        default: 'false'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 缓存数据源
        uses: actions/cache@v4
        with:
          path: .cache
          key: epg-cache-${{ github.run_id }}
          restore-keys: |
            epg-cache-
      - name: 实测 tdm.mjs
        run: |
          mkdir -p out
          {
            echo "=== listChannels（真探版）==="
            node -e "
              import('./src/sources/tdm.mjs').then(async m => {
                const l = await m.listChannels();
                console.log(JSON.stringify(l, null, 1));
                const t = l.reduce((s,c)=>s+c.count,0);
                const d = l.reduce((s,c)=>s+c.withDesc,0);
                console.error('共 ' + l.length + ' 台 / ' + t + ' 条 / ' + d + ' 条简介');
              })
            " 2>&1
            echo
            echo "=== 真探天数分布（从 -3 到 +6 逐日）==="
            node -e "
              import('./src/sources/tdm.mjs').then(async m => {
                const base = Date.now() + 8*3600e3;
                for (const cid of ['1','2','5','6','7','8']) {
                  const hits = [];
                  for (let i=-3;i<=6;i++){
                    const ymd = new Date(base+i*86400e3).toISOString().slice(0,10).replace(/-/g,'');
                    const r = await m.getDayProgrammes(cid,1,ymd);
                    if (r.programmes.length) hits.push(ymd.slice(4,6)+'-'+ymd.slice(6,8)+'('+r.programmes.length+')');
                  }
                  console.log('channelId='+cid, '命中 '+hits.length+' 天:', hits.join(' ') || '无');
                }
              })
            " 2>&1
          } > out/report.txt 2>&1
      - name: 全量重扫 catalog + build
        if: github.event.inputs.full == 'true'
        run: |
          npm test 2>&1 | tail -20 >> out/report.txt
          echo "" >> out/report.txt
          echo "=== catalog 重扫 ===" >> out/report.txt
          node src/index.mjs catalog 2>&1 | tail -30 >> out/report.txt
          echo "" >> out/report.txt
          echo "=== build ===" >> out/report.txt
          DAYS=7 node src/index.mjs build 2>&1 | grep -E "\[tdm\]|\[match\].*Macau|\[match\].*澳门|错误|失败|完成|覆盖" >> out/report.txt
          echo "" >> out/report.txt
          echo "=== report.json 关键数字 ===" >> out/report.txt
          node -e "
            const r=require('./output/report.json');
            console.log('频道', r.channelsTotal, '有节目', r.channelsWithEpg, '空', r.channelsEmpty, '满7天', r.channelsFull);
            console.log('节目', r.programmesTotal, '简介', r.programmesWithDesc, r.descCoverage+'%');
            const d=(r.detail||[]).filter(x=>String(x.usedSource||'').startsWith('tdm'));
            for(const x of d) console.log(' ', x.id, '| 条', x.count, '| 简', x.withDesc, '| 天', x.days);
          " >> out/report.txt 2>&1
      - name: 打包产物
        if: github.event.inputs.full == 'true'
        run: |
          cp channels/catalog.json out/catalog-new.json 2>/dev/null || true
          cp output/report.json out/report-full.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: tdm-probe, path: out/ }
