name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 验证节目单接口
        run: |
          mkdir -p out
          B="https://appapi.tdm.com.mo"
          {
            echo "=== A) program-list/Channel"
            curl -sSL --max-time 20 "$B/api/v1.0/program-list/Channel" -o out/ch.json
            wc -c out/ch.json; head -c 1200 out/ch.json; echo
            echo
            echo "=== B) program-list/categories"
            curl -sSL --max-time 20 "$B/api/v1.0/program-list/categories" | head -c 600; echo
            echo
            echo "=== C) live"
            curl -sSL --max-time 20 "$B/api/v1.0/live" | head -c 600; echo
            echo
            echo "=== D) live/categories"
            curl -sSL --max-time 20 "$B/api/v1.0/live/categories" | head -c 600; echo
            echo
            echo "=== E) program-list/Channel 带参数试探"
            for q in "?date=2026-10-28" "?channelId=1" "?lang=zh" "?page=1&size=50" "?channelCode=1"; do
              echo "--- $q"
              curl -sSL --max-time 15 "$B/api/v1.0/program-list/Channel$q" | head -c 250; echo
            done
          } > out/report.txt 2>&1
          cp out/ch.json out/channel.json 2>/dev/null
      - uses: actions/upload-artifact@v4
        with: { name: tdm-probe, path: out/ }
