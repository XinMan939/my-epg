name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 追踪 /api 重定向 + 挖前端 JS 里的 API 定义
        run: |
          echo "===== /api 重定向目标 ====="
          curl -sS -i --max-time 20 "https://appapi.tdm.com.mo/api" 2>&1 | grep -iE "^(HTTP|location)"
          echo
          echo "===== 根页面里的 JS/资源 ====="
          curl -sS --max-time 20 "https://appapi.tdm.com.mo/" -o /tmp/root.html
          grep -oE '(src|href)="[^"]*"' /tmp/root.html | head -20
          echo
          echo "===== 抓所有 js chunk 里的 API 路径 ====="
          for js in $(grep -oE 'src="[^"]*\.js[^"]*"' /tmp/root.html | sed 's/src="//;s/"//' | head -10); do
            url="https://appapi.tdm.com.mo/${js#/}"
            echo "--- $js"
            curl -sS --max-time 25 "$url" -o /tmp/c.js 2>/dev/null
            grep -oE '"/?(api|v1|v2)/[a-zA-Z0-9_/-]{2,50}"' /tmp/c.js 2>/dev/null | sort -u | head -15
            grep -oE 'https?://[a-zA-Z0-9._-]*(tdm|api)[a-zA-Z0-9._/-]*' /tmp/c.js 2>/dev/null | sort -u | head -10
          done
          echo
          echo "===== 常见 TDM 接口猜测 ====="
          for p in "api/live" "api/getLive" "api/channelList" "api/programList" "api/epgList" "api/v1/channel" "api/v2/channel"; do
            c=$(curl -sS -o /tmp/o.txt -w "%{http_code}|%{size_download}" --max-time 15 "https://appapi.tdm.com.mo/$p" 2>&1||echo ERR)
            echo "/$p → $c"
          done
