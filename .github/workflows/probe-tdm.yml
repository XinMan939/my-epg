name: 探测 TDM API（临时）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 看 SSR 页面真实内容 + 内联脚本里的 API
        run: |
          echo "===== /api/?&ssr=off 内容前 800 字 ====="
          curl -sSL --max-time 25 "https://appapi.tdm.com.mo/api/?&ssr=off" -o /tmp/a.html
          wc -c /tmp/a.html
          head -c 800 /tmp/a.html; echo
          echo
          echo "===== 根页面前 1500 字 ====="
          curl -sSL --max-time 25 "https://appapi.tdm.com.mo/" -o /tmp/r.html
          head -c 1500 /tmp/r.html; echo
          echo
          echo "===== 页面里所有内联 script 的 key 名 ====="
          grep -oE '__NUXT__|__NEXT_DATA__|window\.[A-Za-z_]+|createApp|__INITIAL' /tmp/r.html | sort -u | head
          echo
          echo "===== 找所有 api 相关字符串 ====="
          grep -oiE '[a-z0-9_/.-]{0,40}api[a-z0-9_/.-]{0,60}' /tmp/r.html | sort -u | head -25
          echo
          echo "===== 试 SSR 关掉后的常见路径 ====="
          for p in "api/?&ssr=off" "api/channel?ssr=off" "api/epg?ssr=off" "api/v1?ssr=off"; do
            c=$(curl -sSL -o /tmp/t.txt -w "%{http_code}|%{size_download}|%{content_type}" --max-time 20 "https://appapi.tdm.com.mo/$p" 2>&1||echo ERR)
            echo "/$p → $c"
            head -c 150 /tmp/t.txt 2>/dev/null|tr -d '\n'; echo
          done
