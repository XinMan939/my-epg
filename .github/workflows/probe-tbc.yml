name: TBC 可达性探测（临时）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 探测 TBC（直连，无代理）
        run: |
          echo "=== runner IP 归属 ==="
          curl -s --max-time 10 https://ipinfo.io/json || echo "(ipinfo 失败)"
          echo
          echo "=== DNS ==="
          getent hosts www.tbc.net.tw || nslookup www.tbc.net.tw || true
          echo
          echo "=== 首页 ==="
          curl -sS -o /dev/null -w "首页: HTTP %{http_code} | %{time_total}s | %{size_download} bytes\n" --max-time 25 https://www.tbc.net.tw/ || echo "首页失败"
          echo
          echo "=== EPG 页 ==="
          curl -sS -o /dev/null -w "EPG: HTTP %{http_code} | %{time_total}s | %{size_download} bytes\n" --max-time 25 https://www.tbc.net.tw/Epg/Epg/indexV2 || echo "EPG 失败"
          echo
          echo "=== 单频道 ==="
          curl -sS -o /dev/null -w "ch005: HTTP %{http_code} | %{time_total}s | %{size_download} bytes\n" --max-time 25 https://www.tbc.net.tw/EPG/Epg/ChannelV2?channelId=005 || echo "单频道失败"
